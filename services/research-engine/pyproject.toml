
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholargraph-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "groq",
    "langchain",
    "langchain-core",
    "langchain-groq",
    "langgraph",
    "pydantic",
    "email-validator",
    "google-auth",
    "pwdlib[argon2]",
    "python-dotenv",
    "sqlalchemy",
    "psycopg",
    "cryptography",
    "tiktoken",
     "uvicorn"
]

[dependency-groups]
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]
namespaces = false

[tool.setuptools.package-data]
app = ["**/*"]
